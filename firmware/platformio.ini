; EdgeAI ControlLab — ESP32-S3 real-time motor control firmware
;
; Pick the env that matches the USB connector you plug into:
;   esp32s3_uart : board's "COM"/"UART" port (CH340/CP2102 bridge) -> /dev/cu.usbserial* or /dev/cu.wchusbserial*
;   esp32s3_usb  : board's native "USB" port (GPIO19/20)            -> /dev/cu.usbmodem*
;
;   pio run -e esp32s3_uart -t upload && pio device monitor -e esp32s3_uart

[platformio]
default_envs = esp32s3_uart

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 460800
monitor_filters = time
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    madhephaestus/ESP32Encoder@^0.11.7
    adafruit/Adafruit INA219@^1.2.3
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; 100 Hz JSON telemetry is ~14 KB/s, so 115200 baud is too slow. 1 Mbaud is reliable on CH340 and CP2102.
[env:esp32s3_uart]
monitor_speed = 1000000
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D LAB_SERIAL_BAUD=1000000

[env:esp32s3_usb]
monitor_speed = 1000000
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LAB_SERIAL_BAUD=1000000
